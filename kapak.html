<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Gig Kapak — 1280x769 ekran görüntüsü al</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:769px;overflow:hidden;background:#0F1115;color:#EDEAE4;font-family:'Manrope',sans-serif;display:flex;align-items:center;justify-content:center}
.stage{width:1280px;height:769px;padding:70px 80px;position:relative;background:radial-gradient(900px 500px at 85% 15%,rgba(91,192,190,.14),transparent 60%),#0F1115}
.eyebrow{color:#5BC0BE;font-weight:800;letter-spacing:.3em;text-transform:uppercase;font-size:18px}
h1{font-family:'Fraunces',serif;font-weight:900;font-size:84px;line-height:1.04;margin-top:22px}
h1 em{font-style:italic;color:#5BC0BE}
.feat{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-top:40px}
.feat span{border:1.5px solid rgba(237,234,228,.25);border-radius:999px;padding:12px 26px;font-size:20px;font-weight:600}
.phones{position:absolute;right:80px;bottom:-60px;display:flex;gap:24px}
.ph{width:190px;height:390px;border-radius:28px;border:5px solid #2A2E38;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.ph.a{background:linear-gradient(180deg,#1E3B2F 45%,#FBF7EF 45%)}
.ph.b{background:linear-gradient(180deg,#14151A 55%,#B33A3A 55%);transform:translateY(-36px)}
.ph.c{background:linear-gradient(180deg,#26201B 30%,#FCF8F2 30%)}
.ph .bar{height:10px;width:60%;margin:24px auto 0;border-radius:6px;background:rgba(255,255,255,.35)}
.ph .bar.s{width:40%;margin-top:10px;background:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="stage">
  <div class="eyebrow">Web Tasarım · Mobil Uyumlu</div>
  <h1>İşletmenize özel<br>tek sayfa site,<br><em>24 saatte.</em></h1>
  <div class="feat"><span>📱 Mobil öncelikli</span><span>💬 WhatsApp butonu</span><span>⚡ Hızlı teslim</span></div>
  <div class="phones">
    <div class="ph a"><div class="bar"></div><div class="bar s"></div></div>
    <div class="ph b"><div class="bar"></div><div class="bar s"></div></div>
    <div class="ph c"><div class="bar"></div><div class="bar s"></div></div>
  </div>
</div>
</body>
</html>
